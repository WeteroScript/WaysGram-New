<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Fragment</title>
<style>
  :root {
    --bg: #17212b;
    --bg-soft: #1e2a36;
    --card: #212d3a;
    --card-soft: #26333f;
    --text: #f4f7fa;
    --muted: #7f8f9d;
    --line: #293644;
    --blue: #2e82dd;
    --green: #4fbf67;
    --red: #e2686a;
    --radius: 12px;
  }
  body.light {
    --bg: #f2f4f7;
    --bg-soft: #e9edf2;
    --card: #ffffff;
    --card-soft: #f1f4f8;
    --text: #13202b;
    --muted: #798694;
    --line: #e2e8ee;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, "Roboto", "Segoe UI", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.35;
    padding-bottom: 28px;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1, h2, h3 { margin: 0; font-weight: 700; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* Шапка сайта */
  .brand {
    display: flex; align-items: center; gap: 9px;
    padding: 10px 16px 6px;
    max-width: 760px; margin: 0 auto;
  }
  .brand svg { width: 24px; height: 24px; fill: var(--text); flex: 0 0 auto; }
  .brand .wordmark { font-weight: 700; font-size: 19px; letter-spacing: 1.6px; }
  .brand .spacer { flex: 1; }
  /* Вкладки */
  .tabs {
    display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none;
    padding: 4px 16px 0; border-bottom: 1px solid var(--line);
    max-width: 760px; margin: 0 auto;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    padding: 10px 2px 8px; color: var(--muted); font-size: 16px; white-space: nowrap;
    border-bottom: 3px solid transparent; margin-bottom: -1px;
  }
  .tabs button.active { color: var(--text); font-weight: 700; border-bottom-color: var(--blue); }

  .view { padding: 6px 0 20px; }
  .pad { padding: 0 12px; }
  .hero { padding: 12px 24px 2px; text-align: center; }
  .hero h1 { font-size: 23px; }
  .hero p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }

  /* Поиск */
  .search {
    display: flex; align-items: center; gap: 9px;
    background: var(--card-soft); border-radius: 11px;
    padding: 0 12px; height: 44px; margin: 8px 12px 2px;
  }
  .search svg { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }
  .search input {
    flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
    font-size: 14px; color: var(--text);
  }
  .search input::placeholder { color: var(--muted); }

  .row { display: flex; align-items: center; gap: 8px; }
  .section-head { display: flex; align-items: center; gap: 6px; padding: 14px 12px 6px; }
  .section-head h2 { font-size: 19px; flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--card-soft); color: var(--text);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; font-weight: 600;
    white-space: nowrap;
  }
  .chip.on { background: var(--blue); color: #fff; }

  /* Таблица юзернеймов */
  .table { background: var(--card); border-radius: var(--radius); margin: 2px 12px; overflow: hidden; }
  .thead {
    display: flex; justify-content: space-between; padding: 8px 14px;
    font-size: 12px; color: var(--muted);
  }
  .trow {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-top: 1px solid var(--line);
  }
  .trow:first-child { border-top: 0; }
  .trow .name { font-size: 15px; font-weight: 700; }
  .trow .sub { font-size: 12px; color: var(--blue); margin-top: 1px; }
  .trow .side { margin-left: auto; text-align: right; }
  .trow .amount { font-size: 15px; font-weight: 700; }
  .trow .state { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .trow .state.green { color: var(--green); }
  .chev { color: var(--muted); font-size: 20px; line-height: 1; margin-left: 4px; }
  .badge {
    display: inline-block; border-radius: 5px; padding: 1px 5px;
    font-size: 11px; font-weight: 600; margin-left: 6px; vertical-align: 1px;
  }
  .badge.green { color: var(--green); background: rgba(79, 191, 103, .18); }
  .badge.blue { color: var(--blue); background: rgba(46, 130, 221, .18); }
  .badge.muted { color: var(--muted); background: rgba(127, 143, 157, .18); }

  .card { background: var(--card); border-radius: var(--radius); margin: 4px 12px; padding: 12px 14px; }
  .card + .card { margin-top: 8px; }
  .card .label { font-size: 12px; color: var(--muted); }
  .card .value { font-size: 14px; font-weight: 600; word-break: break-all; }
  .card .value.big { font-size: 18px; }
  .card .note { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .kv { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .kv:first-of-type { border-top: 0; }
  .kv .k { color: var(--muted); font-size: 13px; flex: 1; }
  .kv .v { font-weight: 600; font-size: 14px; }
  .link { color: var(--blue); font-weight: 600; font-size: 14px; }
  input.field, select.field {
    width: 100%; height: 42px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg-soft); color: var(--text); padding: 0 12px; outline: none;
    margin-top: 8px; font-size: 15px;
  }
  .primary {
    display: block; width: 100%; height: 46px; border-radius: 10px;
    background: var(--blue); color: #fff; font-weight: 600; font-size: 15px;
    margin: 10px 12px 0; width: calc(100% - 24px);
  }
  .primary[disabled] { opacity: .5; }

  /* Сетка подарков */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px 12px; }
  .tile { display: flex; flex-direction: column; gap: 5px; text-align: left; }
  .tile .art {
    position: relative; border-radius: 10px; aspect-ratio: 1 / 1; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .tile .art .emoji { font-size: 34px; }
  .tile .art img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    padding: 10%; image-rendering: auto;
  }
  .tile .model-art, .big-art .model-art {
    position: absolute; inset: 5%; display: flex; align-items: center; justify-content: center;
    visibility: hidden; opacity: 0; transition: opacity .15s ease; z-index: 1;
  }
  .tile .model-art.active, .big-art .model-art.active { visibility: visible; opacity: 1; }
  .tile .model-art svg, .tile .model-art video,
  .big-art .model-art svg, .big-art .model-art video,
  .tile .model-art img, .big-art .model-art img {
    display: block; width: 100%; height: 100%; object-fit: contain;
  }
  .tile .pattern-art, .big-art .pattern-art {
    position: absolute; inset: 5%; display: flex; align-items: center; justify-content: center;
    visibility: hidden; opacity: 0; transition: opacity .15s ease; z-index: 2; pointer-events: none;
  }
  .tile .pattern-art.active, .big-art .pattern-art.active { visibility: visible; opacity: 1; }
  .tile .pattern-art svg, .tile .pattern-art video,
  .big-art .pattern-art svg, .big-art .pattern-art video,
  .tile .pattern-art img, .big-art .pattern-art img {
    display: block; width: 100%; height: 100%; object-fit: contain;
  }
  .tile .price { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; }
  .tile .price .grow { flex: 1; }
  .tile .price .state { font-size: 11px; font-weight: 600; }
  .tile .price .state.green { color: var(--green); }
  .tile .price .state.blue { color: var(--blue); }
  .tile .price .state.muted { color: var(--muted); }
  .inventory-item { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .inventory-item .tile { width: 100%; }
  .inventory-withdraw {
    min-height: 34px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--card); color: var(--blue); font-size: 13px; font-weight: 700;
  }
  .inventory-withdraw[disabled] { opacity: .5; }

  .hint { margin: 6px 12px; }

  /* Страница лота */
  .detail-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px 2px; }
  .detail-head .back { font-size: 24px; line-height: 1; color: var(--text); padding: 2px 6px 2px 0; }
  .detail-head h2 { font-size: 20px; }
  .big-art {
    margin: 8px 12px; height: 200px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
  }
  .big-art .emoji { font-size: 64px; }
  .big-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 12%; }

  .choice-menu {
    position: fixed; z-index: 1000; min-width: 168px; max-width: calc(100vw - 24px);
    max-height: min(60vh, 360px); overflow-y: auto; background: var(--card);
    border: 1px solid var(--line); border-radius: 11px; padding: 5px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .38);
  }
  .choice-menu button {
    display: block; width: 100%; text-align: left; padding: 10px 12px;
    border-radius: 7px; font-size: 14px; white-space: nowrap;
  }
  .choice-menu button:active, .choice-menu button.selected { background: var(--card-soft); }
  .selected-filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 7px 12px 2px; }
  .selected-filter {
    display: inline-flex; align-items: center; gap: 7px; max-width: 100%;
    padding: 6px 9px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); color: var(--text); font-size: 12px; white-space: nowrap;
  }
  .selected-filter .remove { color: var(--muted); font-size: 15px; line-height: 1; }
  .tile-number {
    position: absolute; z-index: 3; top: 6px; left: 6px; padding: 3px 6px;
    border-radius: 7px; color: #fff; background: rgba(10, 17, 24, .68);
    font-size: 10px; font-weight: 700; line-height: 1.1;
  }
  .selection-sheet { position: fixed; inset: 0; z-index: 1100; display: flex; justify-content: center; align-items: flex-end; }
  .sheet-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .56); }
  .sheet-panel {
    position: relative; z-index: 1; display: flex; flex-direction: column;
    width: 100%; max-width: 760px; max-height: 94vh; min-height: 55vh;
    padding: 7px 0 max(14px, env(safe-area-inset-bottom));
    background: var(--bg); border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.25);
  }
  .sheet-grabber { width: 38px; height: 4px; border-radius: 5px; background: var(--muted); opacity: .55; margin: 0 auto 6px; }
  .sheet-head { display: flex; align-items: center; gap: 10px; padding: 9px 14px 12px; border-bottom: 1px solid var(--line); }
  .sheet-head h2 { flex: 1; min-width: 0; font-size: 19px; }
  .sheet-close { width: 30px; font-size: 27px; line-height: 1; color: var(--muted); text-align: left; }
  .sheet-clear { color: var(--blue); font-size: 13px; font-weight: 700; white-space: nowrap; }
  .sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px 18px; overscroll-behavior: contain; }
  .sheet-search {
    display: flex; align-items: center; gap: 9px; height: 42px; margin: 2px 0 10px;
    padding: 0 12px; border-radius: 11px; background: var(--card-soft); color: var(--muted);
  }
  .sheet-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 14px; }
  .sheet-search input::placeholder { color: var(--muted); }
  .collection-list { display: flex; flex-direction: column; gap: 3px; }
  .collection-row {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 66px;
    padding: 8px 10px; border-radius: 12px; text-align: left; background: transparent;
  }
  .collection-row:active, .collection-row.selected { background: var(--card); }
  .collection-icon {
    width: 48px; height: 48px; flex: 0 0 auto; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center; border-radius: 13px;
    background: var(--card-soft); font-size: 25px;
  }
  .collection-icon img { position: absolute; inset: 0; width: 100%; height: 100%; padding: 5px; object-fit: contain; }
  .collection-copy { min-width: 0; flex: 1; }
  .collection-name { display: block; overflow: hidden; text-overflow: ellipsis; font-size: 14px; font-weight: 700; }
  .collection-count { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
  .collection-check { width: 21px; height: 21px; flex: 0 0 auto; border: 1.5px solid var(--muted); border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; }
  .collection-row.selected .collection-check { border-color: var(--blue); background: var(--blue); }
  .filter-section { margin-bottom: 8px; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  .filter-section-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 13px 12px; text-align: left; }
  .filter-section-head strong { flex: 1; font-size: 15px; }
  .filter-section-head .selected-count { color: var(--muted); font-size: 12px; }
  .filter-section-head .arrow { color: var(--muted); transition: transform .15s ease; }
  .filter-section.open .filter-section-head .arrow { transform: rotate(180deg); }
  .filter-section-body { padding: 0 10px 10px; border-top: 1px solid var(--line); }
  .filter-actions { display: flex; align-items: center; justify-content: space-between; padding: 9px 2px 6px; }
  .filter-actions span { font-size: 12px; color: var(--muted); }
  .filter-actions button { color: var(--blue); font-size: 12px; font-weight: 700; }
  .filter-option-list { max-height: 250px; overflow-y: auto; }
  .filter-option {
    display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 5px 2px;
    border-top: 1px solid var(--line); cursor: pointer;
  }
  .filter-option input { width: 18px; height: 18px; margin: 0; accent-color: var(--blue); }
  .filter-option .option-name { flex: 1; font-size: 13px; }
  .filter-option .option-count { color: var(--muted); font-size: 12px; }
  @media (min-width: 700px) {
    .sheet-panel { align-self: center; width: min(640px, calc(100% - 32px)); max-height: 86vh; min-height: 0; border-radius: 20px; }
    .sheet-grabber { display: none; }
  }
  .toast {
    position: fixed; left: 12px; right: 12px; bottom: 16px;
    background: var(--card-soft); color: var(--text);
    border-radius: 10px; padding: 11px 14px; font-size: 14px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
  }
  .empty { color: var(--muted); font-size: 13px; padding: 14px 16px; }
  .skeleton { color: var(--muted); font-size: 13px; padding: 14px 16px; }
</style>
<script defer src="/fragment/assets/pako_inflate.min.js"></script>
<script defer src="/fragment/assets/lottie_light.min.js"></script>
</head>
<body>
<header class="brand">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.4 2.2l19.4 9.1c.5.2.5.9 0 1.1l-8 3.4-3.4 8c-.2.5-.9.5-1.1 0L2.4 3.3c-.2-.5.3-1 .8-.9z"/></svg>
  <span class="wordmark">FRAGMENT</span>
  <span class="spacer"></span>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="usernames" class="active">Юзернеймы</button>
  <button data-tab="gifts">Подарки</button>
  <button data-tab="inventory">Инвентарь</button>
</nav>

<main>
  <section class="view" id="view-usernames">
    <div class="hero">
      <h1>Купить и продать юзернеймы</h1>
      <p>Имя для аккаунта, канала или группы.</p>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
      <input id="name-search" placeholder="Введите юзернейм…" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="section-head">
      <h2 id="names-title">Юзернеймы на продаже</h2>
      <button class="chip" id="names-sort">Цена ↓</button>
    </div>
    <div class="row" style="padding: 0 12px 5px;">
      <button class="chip" id="user-autorefresh">Авто-обновление: выкл</button>
    </div>
    <div class="table" id="names-table"></div>
    <div class="section-head"><h2>Мои юзернеймы</h2></div>
    <div id="my-names"></div>
  </section>

  <section class="view" id="view-gifts" hidden>
    <div class="row" style="padding: 6px 12px 0;">
      <div class="search" style="margin: 0; flex: 1;">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
        <input id="gift-search" placeholder="Поиск по названию…" autocomplete="off">
      </div>
      <button class="chip" id="collections" style="height: 38px; margin-top: 3px;">Коллекции</button>
      <button class="chip" id="gift-filter" style="height: 38px; margin-top: 3px;">Фильтры</button>
    </div>
    <div class="selected-filters" id="selected-filters" hidden></div>
    <div class="section-head"><h2>Мои лоты</h2></div>
    <div class="grid" id="my-gift-grid"></div>
    <div class="section-head">
      <h2>Подарки</h2>
      <button class="chip" id="gift-sort">Цена ↓</button>
    </div>
    <div class="row" style="padding: 0 12px 5px;">
      <button class="chip" id="gift-autorefresh">Авто-обновление: выкл</button>
    </div>
    <div class="grid" id="gift-grid"></div>
  </section>

  <section class="view" id="view-inventory" hidden>
    <div class="card hint">
      <div class="label">Купленные и переданные подарки хранятся у @fragment. Выставьте подарок на продажу или нажмите «Вывести», чтобы получить его в профиль.</div>
      <div class="link" id="copy-fragment" style="margin-top: 6px;">Скопировать @fragment</div>
    </div>
    <div class="grid" id="inventory-grid"></div>
  </section>

  <section class="view" id="view-detail" hidden></section>
</main>

<div class="selection-sheet" id="selection-sheet" hidden>
  <button class="sheet-backdrop" id="sheet-backdrop" aria-label="Закрыть"></button>
  <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-grabber"></div>
    <header class="sheet-head">
      <button class="sheet-close" id="sheet-close" aria-label="Назад">‹</button>
      <h2 id="sheet-title">Коллекции</h2>
      <button class="sheet-clear" id="sheet-clear">Сбросить</button>
    </header>
    <div class="sheet-body" id="sheet-content"></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";

  var bridge = window.WaysGram || null;
  var token = "";
  var state = {
    tab: "usernames",
    namesSort: "desc",
    giftSort: "desc",
    filters: { collection: [], model: [], backdrop: [], symbol: [] },
    giftQuery: "",
    market: null,
    mine: null,
    gifts: null,
    ownListings: null,
    giftCatalog: null,
    inventory: null,
    sheetMode: "",
    sheetSearch: { collection: "", model: "", backdrop: "", symbol: "" },
    openFilterSections: { collection: true, model: false, backdrop: false, symbol: false },
    autoRefresh: { usernames: 0, gifts: 0 },
    busy: false,
    detail: null
  };
  var autoRefreshTimers = { usernames: null, gifts: null };
  var openMenu = null;

  var COLORS = ["#6e7d63", "#4f7f53", "#7c6bb0", "#b0865a", "#4f7e96", "#a06a88"];
  var artCache = {};
  var modelAssetCache = {};
  var activeModelPlayers = [];
  var activeModelObservers = [];
  var modelRenderGeneration = 0;

  function $(id) { return document.getElementById(id); }

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function num(value) {
    var n = Number(value || 0);
    return n.toLocaleString("ru-RU");
  }

  function toast(message) {
    var node = $("toast");
    node.textContent = message;
    node.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { node.hidden = true; }, 2600);
  }

  function headers(extra) {
    var result = { "Accept": "application/json" };
    if (token) { result["Authorization"] = "Bearer " + token; }
    if (extra) { Object.keys(extra).forEach(function (key) { result[key] = extra[key]; }); }
    return result;
  }

  function idem(action, name) {
    var clean = String(name || "x").replace(/[^a-zA-Z0-9_-]/g, "").toLowerCase();
    return "wg-" + action + "-" + clean + "-" + Date.now();
  }

  function api(path, options) {
    options = options || {};
    var init = {
      method: options.method || "GET",
      headers: headers(options.idempotency ? { "Idempotency-Key": options.idempotency } : null)
    };
    if (options.body !== undefined) {
      init.headers["Content-Type"] = "application/json; charset=utf-8";
      init.body = JSON.stringify(options.body);
    }
    return fetch(path, init).then(function (response) {
      return response.text().then(function (text) {
        var data = {};
        if (text) {
          try { data = JSON.parse(text); } catch (error) { data = {}; }
        }
        if (!response.ok) {
          var detail = data && data.detail;
          var message = "";
          if (detail && typeof detail === "object") { message = detail.message || detail.code || ""; }
          if (!message && typeof detail === "string") { message = detail; }
          if (!message) { message = "Не удалось выполнить действие"; }
          var failure = new Error(message);
          failure.status = response.status;
          throw failure;
        }
        return data;
      });
    });
  }

  function timeLeft(secondsEnd) {
    var left = Number(secondsEnd || 0) - Math.floor(Date.now() / 1000);
    if (left <= 0) { return "завершён"; }
    var days = Math.floor(left / 86400);
    var hours = Math.floor((left % 86400) / 3600);
    if (days > 0) { return days + " дн. " + hours + " ч"; }
    return Math.max(1, hours) + " ч";
  }

  function currencyOf(item) {
    return String(item && (item.currency || item.listing_currency) || "stars").toLowerCase() === "grams"
      ? "grams" : "stars";
  }

  function priceOf(item) {
    if (item && item.price !== undefined && item.price !== null) { return Number(item.price || 0); }
    return currencyOf(item) === "grams"
      ? Number(item.price_grams || 0) : Number(item.price_stars || 0);
  }

  function priceLabel(item, amount) {
    var value = amount === undefined ? priceOf(item) : Number(amount || 0);
    return currencyOf(item) === "grams"
      ? "💎 " + num(value) + " Gram" : "⭐ " + num(value) + " Stars";
  }

  function colorHex(value) {
    if (value === null || value === undefined || value === "") { return ""; }
    var raw = String(value).trim();
    if (/^#[0-9a-f]{3,6}$/i.test(raw)) { return raw; }
    if (/^[0-9a-f]{6}$/i.test(raw)) { return "#" + raw; }
    var number = Number(value);
    if (!isFinite(number) || number < 0 || number > 0xFFFFFF) { return ""; }
    var hex = Math.floor(number).toString(16);
    while (hex.length < 6) { hex = "0" + hex; }
    return "#" + hex;
  }

  function colorFor(item) {
    var traits = item && item.attributes && item.attributes.collectible_traits;
    var backdrop = traits && traits.backdrop;
    if (backdrop && typeof backdrop === "object") {
      var center = colorHex(backdrop.center_color);
      var edge = colorHex(backdrop.edge_color);
      if (center && edge) {
        return "radial-gradient(circle at 50% 40%, " + center + " 0%, " + edge + " 100%)";
      }
      if (center || edge) { return center || edge; }
    }
    var key = String(item.telegram_gift_id || "") + String(item.serial_number || item.name || "");
    var hash = 0;
    for (var i = 0; i < key.length; i++) { hash = (hash * 31 + key.charCodeAt(i)) | 0; }
    return COLORS[Math.abs(hash) % COLORS.length];
  }

  /* Картинка подарка: обычный <img> не может передать Authorization, поэтому качаем blob. */
  function artwork(giftId, img, emojiNode) {
    if (!giftId) { return; }
    var key = String(giftId);
    if (artCache[key]) {
      img.src = artCache[key];
      img.hidden = false;
      if (emojiNode) { emojiNode.hidden = true; }
      return;
    }
    fetch("/api/telegram/gifts/" + encodeURIComponent(key) + "/sticker",
      { headers: { "Authorization": "Bearer " + token } })
      .then(function (response) {
        if (!response.ok) { throw new Error("no art"); }
        return response.blob();
      })
      .then(function (blob) {
        if (!/^image\//.test(blob.type)) { throw new Error("not an image"); }
        var url = URL.createObjectURL(blob);
        artCache[key] = url;
        img.src = url;
        img.hidden = false;
        if (emojiNode) { emojiNode.hidden = true; }
      })
      .catch(function () { /* остаётся эмодзи */ });
  }

  function modelDocumentId(item) {
    var value = item && item.model_document_id;
    if (!value) {
      var traits = item && item.attributes && item.attributes.collectible_traits;
      var model = traits && traits.model;
      value = model && typeof model === "object" ? model.document_id : "";
    }
    if (value === null || value === undefined || value === "" || value === 0 || value === "0") {
      return "";
    }
    return String(value).trim();
  }

  function patternDocumentId(item) {
    var value = item && item.pattern_document_id;
    if (!value) {
      var traits = item && item.attributes && item.attributes.collectible_traits;
      var pattern = traits && traits.pattern;
      value = pattern && typeof pattern === "object" ? pattern.document_id : "";
    }
    if (value === null || value === undefined || value === "" || value === 0 || value === "0") {
      return "";
    }
    return String(value).trim();
  }

  function inflateModelJson(bytes) {
    if (bytes.length >= 2 && bytes[0] === 31 && bytes[1] === 139) {
      if (window.pako && typeof window.pako.ungzip === "function") {
        return Promise.resolve(window.pako.ungzip(bytes, { to: "string" }));
      }
      if (window.DecompressionStream && window.Blob && Blob.prototype.stream) {
        var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        return new Response(stream).text();
      }
      return Promise.reject(new Error("gzip decoder unavailable"));
    }
    return Promise.resolve(new TextDecoder("utf-8").decode(bytes));
  }

  function modelAsset(item, documentId) {
    var giftId = String(item.telegram_gift_id || "").trim();
    if (!giftId || !documentId) { return Promise.reject(new Error("model id missing")); }
    var key = giftId + "|" + documentId;
    if (modelAssetCache[key]) { return modelAssetCache[key]; }
    var promise = fetch("/api/telegram/gifts/" + encodeURIComponent(giftId)
      + "/attributes/" + encodeURIComponent(documentId),
      { headers: { "Authorization": "Bearer " + token } })
      .then(function (response) {
        if (!response.ok) { throw new Error("model unavailable"); }
        var mediaType = String(response.headers.get("content-type") || "")
          .split(";")[0].toLowerCase();
        return response.arrayBuffer().then(function (buffer) {
          var bytes = new Uint8Array(buffer);
          var webm = bytes.length >= 4 && bytes[0] === 26 && bytes[1] === 69
            && bytes[2] === 223 && bytes[3] === 163;
          if (mediaType.indexOf("video/") === 0 || webm) {
            return { type: "video", url: URL.createObjectURL(
              new Blob([bytes], { type: mediaType || "video/webm" })) };
          }
          if (mediaType.indexOf("image/") === 0) {
            return { type: "image", url: URL.createObjectURL(
              new Blob([bytes], { type: mediaType })) };
          }
          return inflateModelJson(bytes).then(function (text) {
            JSON.parse(text); // неизвестный формат безопасно оставляем на обычном арте
            return { type: "lottie", text: text };
          });
        });
      });
    modelAssetCache[key] = promise;
    promise.catch(function () {
      if (modelAssetCache[key] === promise) { delete modelAssetCache[key]; }
    });
    return promise;
  }

  function stopGiftModelPlayers() {
    modelRenderGeneration++;
    activeModelObservers.forEach(function (observer) {
      try { observer.disconnect(); } catch (error) { /* ignored */ }
    });
    activeModelObservers = [];
    activeModelPlayers.forEach(function (entry) {
      try {
        if (entry.type === "video") {
          entry.player.pause();
          entry.player.removeAttribute("src");
        } else if (entry.player && typeof entry.player.destroy === "function") {
          entry.player.destroy();
        }
      } catch (error) { /* detached previews must not block navigation */ }
    });
    activeModelPlayers = [];
  }

  function renderGiftModel(item, node, img, emojiNode) {
    var documentId = modelDocumentId(item);
    var generation = modelRenderGeneration;
    if (!documentId || !node) { return; }
    function reveal() {
      if (generation !== modelRenderGeneration
          || !document.documentElement.contains(node)) { return; }
      node.classList.add("active");
      if (img) { img.hidden = true; }
      if (emojiNode) { emojiNode.hidden = true; }
    }
    function fallback() {
      if (!node || generation !== modelRenderGeneration) { return; }
      node.classList.remove("active");
      node.innerHTML = "";
      if (img && img.getAttribute("src")) {
        img.hidden = false;
        if (emojiNode) { emojiNode.hidden = true; }
      } else if (emojiNode) {
        emojiNode.hidden = false;
      }
    }
    modelAsset(item, documentId).then(function (asset) {
      if (generation !== modelRenderGeneration
          || !document.documentElement.contains(node)) { return; }
      node.innerHTML = "";
      if (asset.type === "video") {
        var video = document.createElement("video");
        video.autoplay = true;
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.setAttribute("playsinline", "");
        video.addEventListener("loadeddata", reveal);
        video.addEventListener("error", fallback);
        node.appendChild(video);
        activeModelPlayers.push({ type: "video", player: video });
        video.src = asset.url;
        video.load();
        var playback = video.play();
        if (playback && typeof playback.catch === "function") {
          playback.catch(function () { /* first frame can still be shown */ });
        }
        if (video.readyState >= 2) { reveal(); }
      } else if (asset.type === "image") {
        var image = document.createElement("img");
        image.alt = "";
        image.addEventListener("load", reveal);
        image.addEventListener("error", fallback);
        node.appendChild(image);
        image.src = asset.url;
      } else if (window.lottie && typeof window.lottie.loadAnimation === "function") {
        var animation = window.lottie.loadAnimation({
          container: node,
          renderer: "svg",
          loop: true,
          autoplay: true,
          animationData: JSON.parse(asset.text)
        });
        animation.addEventListener("DOMLoaded", reveal);
        animation.addEventListener("data_failed", fallback);
        activeModelPlayers.push({ type: "lottie", player: animation });
      } else {
        fallback();
      }
    }).catch(function () { fallback(); });
  }

  function requestModelArtwork(item, node, img, emojiNode, eager) {
    if (!modelDocumentId(item)) { return; }
    if (!eager && window.IntersectionObserver) {
      var observer = new IntersectionObserver(function (entries) {
        if (!entries.some(function (entry) { return entry.isIntersecting; })) { return; }
        observer.disconnect();
        renderGiftModel(item, node, img, emojiNode);
      }, { rootMargin: "120px" });
      activeModelObservers.push(observer);
      observer.observe(node);
    } else {
      renderGiftModel(item, node, img, emojiNode);
    }
  }

  function renderGiftPattern(item, node) {
    var documentId = patternDocumentId(item);
    var generation = modelRenderGeneration;
    if (!documentId || !node) { return; }
    function reveal() {
      if (generation === modelRenderGeneration && document.documentElement.contains(node)) {
        node.classList.add("active");
      }
    }
    function fallback() {
      if (generation !== modelRenderGeneration) { return; }
      node.classList.remove("active");
      node.innerHTML = "";
    }
    modelAsset(item, documentId).then(function (asset) {
      if (generation !== modelRenderGeneration
          || !document.documentElement.contains(node)) { return; }
      node.innerHTML = "";
      if (asset.type === "video") {
        var video = document.createElement("video");
        video.autoplay = true;
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.setAttribute("playsinline", "");
        video.addEventListener("loadeddata", reveal);
        video.addEventListener("error", fallback);
        node.appendChild(video);
        activeModelPlayers.push({ type: "video", player: video });
        video.src = asset.url;
        video.load();
        var playback = video.play();
        if (playback && typeof playback.catch === "function") {
          playback.catch(function () { /* first frame can still be shown */ });
        }
        if (video.readyState >= 2) { reveal(); }
      } else if (asset.type === "image") {
        var image = document.createElement("img");
        image.alt = "";
        image.addEventListener("load", reveal);
        image.addEventListener("error", fallback);
        node.appendChild(image);
        image.src = asset.url;
      } else if (window.lottie && typeof window.lottie.loadAnimation === "function") {
        var animation = window.lottie.loadAnimation({
          container: node,
          renderer: "svg",
          loop: true,
          autoplay: true,
          animationData: JSON.parse(asset.text)
        });
        animation.addEventListener("DOMLoaded", reveal);
        animation.addEventListener("data_failed", fallback);
        activeModelPlayers.push({ type: "lottie", player: animation });
      } else {
        fallback();
      }
    }).catch(function () { fallback(); });
  }

  function requestPatternArtwork(item, node, eager) {
    if (!patternDocumentId(item)) { return; }
    if (!eager && window.IntersectionObserver) {
      var observer = new IntersectionObserver(function (entries) {
        if (!entries.some(function (entry) { return entry.isIntersecting; })) { return; }
        observer.disconnect();
        renderGiftPattern(item, node);
      }, { rootMargin: "120px" });
      activeModelObservers.push(observer);
      observer.observe(node);
    } else {
      renderGiftPattern(item, node);
    }
  }

  /* ------------------------------------------------------------- вкладки */

  function showTab(tab) {
    stopGiftModelPlayers();
    state.tab = tab;
    state.detail = null;
    Array.prototype.forEach.call($("tabs").children, function (button) {
      button.classList.toggle("active", button.dataset.tab === tab);
    });
    $("view-usernames").hidden = tab !== "usernames";
    $("view-gifts").hidden = tab !== "gifts";
    $("view-inventory").hidden = tab !== "inventory";
    $("view-detail").hidden = true;
    if (tab === "usernames") { loadUsernames(); }
    if (tab === "gifts") { loadGifts(); }
    if (tab === "inventory") { loadInventory(); }
    window.scrollTo(0, 0);
  }

  function openDetail(html) {
    stopGiftModelPlayers();
    var view = $("view-detail");
    view.innerHTML = html;
    view.hidden = false;
    $("view-usernames").hidden = true;
    $("view-gifts").hidden = true;
    $("view-inventory").hidden = true;
    window.scrollTo(0, 0);
  }

  function closeDetail() {
    $("view-detail").hidden = true;
    state.detail = null;
    showTab(state.tab);
  }

  /* ----------------------------------------------------------- юзернеймы */

  function loadUsernames(force) {
    if (!force && state.market && state.mine) { renderUsernames(); return; }
    if (!state.market) { $("names-table").innerHTML = '<div class="skeleton">Загружаем рынок…</div>'; }
    Promise.all([
      api("/api/collectibles?section=for_sale"),
      api("/api/collectibles?section=mine")
    ]).then(function (result) {
      state.market = (result[0] && result[0].items) || [];
      state.mine = (result[1] && result[1].items) || [];
      renderUsernames();
    }).catch(function (error) {
      $("names-table").innerHTML = '<div class="empty">' + esc(error.message) + "</div>";
    });
  }

  function renderUsernames() {
    $("names-title").textContent = "Юзернеймы на продаже";
    $("names-sort").textContent = state.namesSort === "asc" ? "Цена ↑" : "Цена ↓";
    var query = ($("name-search").value || "").trim().replace(/^@/, "").toLowerCase();
    var items = (state.market || []).filter(function (item) {
      return !query || String(item.name || "").toLowerCase().indexOf(query) === 0;
    }).sort(function (a, b) {
      var assetOrder = currencyOf(a).localeCompare(currencyOf(b));
      if (assetOrder) { return assetOrder; }
      return state.namesSort === "asc" ? priceOf(a) - priceOf(b) : priceOf(b) - priceOf(a);
    });

    var html = '<div class="thead"><span>Юзернейм</span><span>Цена</span></div>';
    if (!items.length) {
      html += '<div class="empty">' + (query ? "Ничего не найдено." : "Пока нет имён на продаже.") + "</div>";
    }
    items.forEach(function (item) {
      var name = String(item.name || "");
      if (!name) { return; }
      html += '<div class="trow" data-name="' + esc(name) + '">'
        + '<div><div class="name">@' + esc(name) + '<span class="badge green">Продажа</span>'
        + '</div><div class="sub">' + esc(name) + '.t.me</div></div>'
        + '<div class="side"><div class="amount">' + esc(priceLabel(item)) + '</div>'
        + '<div class="state green">Фиксированная цена</div></div>'
        + '<div class="chev">›</div></div>';
    });
    $("names-table").innerHTML = html;
    Array.prototype.forEach.call($("names-table").querySelectorAll(".trow"), function (row) {
      row.addEventListener("click", function () { openName(row.dataset.name); });
    });

    var mine = state.mine || [];
    var mineHtml = "";
    if (!mine.length) {
      mineHtml = '<div class="card"><div class="label">У вас пока нет дополнительных юзернеймов.</div>'
        + '<div class="link" style="margin-top:6px;" id="claim-link">Занять свободное имя</div></div>';
    } else {
      mine.forEach(function (item) {
        var entityLabel = item.entity_type === "channel" ? "Канал"
          : (item.entity_type === "group" ? "Группа"
            : (item.entity_type === "account" ? "Аккаунт" : "Юзернейм"));
        var subtitle = item.listing_id
          ? "На продаже · " + priceLabel(item)
          : (item.frozen ? "В вашем профиле · временно нельзя перепродать" : "В вашем профиле");
        if (item.entity_type) {
          subtitle = entityLabel + (item.entity_title ? " · " + item.entity_title : "") + " · " + subtitle;
        }
        mineHtml += '<div class="card" data-name="' + esc(item.name) + '" style="cursor:pointer;">'
          + '<div class="value">@' + esc(item.name) + "</div>"
          + '<div class="note">' + esc(subtitle) + "</div></div>";
      });
    }
    $("my-names").innerHTML = mineHtml;
    var claim = $("claim-link");
    if (claim) { claim.addEventListener("click", function () { openName(""); }); }
    Array.prototype.forEach.call($("my-names").querySelectorAll("[data-name]"), function (card) {
      card.addEventListener("click", function () { openName(card.dataset.name); });
    });

  function copy(value) {
    try {
      var area = document.createElement("textarea");
      area.value = value;
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      document.body.removeChild(area);
      toast("Скопировано");
    } catch (error) {
      toast("Не удалось скопировать");
    }
  }

  /* ------------------------------------------------------ карточка имени */

  function openName(name) {
    var clean = String(name || "").replace(/^@/, "").toLowerCase();
    if (!clean) { openClaim(); return; }
    openDetail('<div class="skeleton">Загружаем @' + esc(clean) + "…</div>");
    api("/api/collectibles/" + encodeURIComponent(clean)).then(function (card) {
      renderNameCard(clean, card);
    }).catch(function (error) {
      openDetail(detailHead("@" + clean, null) + '<div class="empty">' + esc(error.message) + "</div>");
    });

  function detailHead(title, badge) {
    return '<div class="detail-head"><button class="back" id="detail-back">‹</button>'
      + "<h2>" + esc(title) + "</h2>" + (badge || "") + "</div>";
  }

  function renderNameCard(name, card) {
    var mine = !!card.mine;
    var listed = !!card.for_sale;
    var price = listed ? Number(card.price || priceOf(card)) : 0;
    var saleCurrency = currencyOf(card);
    var badge = listed ? '<span class="badge green">Продаётся</span>'
      : (mine ? '<span class="badge muted">Ваше имя</span>'
        : '<span class="badge muted">Свободно</span>');
    var html = detailHead("@" + name, badge);
    html += '<div class="card">'
      + '<div class="kv"><span class="k">Владелец</span><span class="v">'
      + esc(card.owner && (card.owner.username ? "@" + card.owner.username
        : card.owner.display_name || "—") || (mine ? "Вы" : "—")) + "</span></div>"
      + '<div class="kv"><span class="k">Ссылка</span><span class="v">' + esc(name) + ".t.me</span></div>";
    var entityType = card.entity_type === "channel" ? "Канал"
      : (card.entity_type === "group" ? "Группа"
        : (card.entity_type === "account" ? "Аккаунт" : ""));
    if (entityType) {
      html += '<div class="kv"><span class="k">Имя используется</span><span class="v">'
        + esc(entityType + (card.entity_title ? " · " + card.entity_title : "")) + "</span></div>";
    }
    if (card.purchase_date) {
      html += '<div class="kv"><span class="k">Во владении с</span><span class="v">'
        + new Date(card.purchase_date * 1000).toLocaleDateString("ru-RU") + "</span></div>";
    }
    if (listed) {
      html += '<div class="kv"><span class="k">Цена</span><span class="v">'
        + esc(priceLabel({ currency: saleCurrency }, price)) + "</span></div>";
    }
    if (card.frozen && card.frozen_until) {
      html += '<div class="kv"><span class="k">Повторная продажа</span><span class="v">после '
        + new Date(card.frozen_until * 1000).toLocaleDateString("ru-RU") + "</span></div>";
    }
    html += "</div>";

    if (!mine && listed) {
      html += '<button class="primary" id="buy">Купить за ' + esc(priceLabel({ currency: saleCurrency }, price)) + "</button>";
    } else if (!mine && card.free) {
      html += '<button class="primary" id="claim">Занять за ⭐ '
        + num(card.system_price_stars || card.claim_price_stars || 0) + "</button>";
    }
    if (mine) {
      if (listed) {
        html += '<button class="primary" id="unlist">Снять с продажи</button>';
      } else if (card.frozen) {
        html += '<div class="card"><div class="label">После покупки имя можно будет перепродать через сутки.</div></div>';

          + '<input class="field" id="list-price" inputmode="numeric" placeholder="Сумма">'
          + '<button class="primary" id="list">Выставить на продажу</button>'
          + '<div class="note">Комиссия сервиса: ' + num(card.commission_percent || 5) + "%</div></div>";
      }
    }

    openDetail(html);
    bindDetailBack();
    if ($("buy")) {
      $("buy").addEventListener("click", function () {
        nameAction("buy", "Куплено и добавлено в ваш профиль", "/buy", {});
      });
    }
    if ($("claim")) {
      $("claim").addEventListener("click", function () {
        nameAction("claim", "Имя добавлено в ваш профиль", "/claim", {});
      });
    }
    if ($("list")) {
      $("list").addEventListener("click", function () {
        var value = Number(($("list-price").value || "").trim());
        if (!(value > 0)) { toast("Укажите цену"); return; }
        var currency = $("list-currency").value;
        nameAction("listing", "Выставлено на продажу", "/listing", { currency: currency, price: value }, "PUT");
      });
    }
    if ($("unlist")) {
      $("unlist").addEventListener("click", function () {
        nameAction("unlist", "Снято с продажи", "/listing", null, "DELETE");
      });
    }

    state.detail = name;

    function nameAction(action, success, path, body, method) {
      if (state.busy) { return; }
      state.busy = true;
      var options = {
        method: method || "POST",
        idempotency: method ? null : idem(action, name)
      };
      if (body) { options.body = body; }
      api("/api/collectibles/" + encodeURIComponent(name) + path, options)
        .then(function () {
          state.busy = false;
          state.market = state.mine = null;
          toast(success);
          openName(name);
        })
        .catch(function (error) {
          state.busy = false;
          toast(error.message);
        });
    }
  }

  function openClaim() {
    openDetail(detailHead("Занять свободное имя", null)
      + '<div class="card"><div class="label">После оплаты имя появится в вашем профиле как дополнительное.</div>'
      + '<input class="field" id="claim-name" placeholder="юзернейм" autocapitalize="off" spellcheck="false">'
      + '<button class="primary" id="claim-go">Продолжить</button></div>');
    bindDetailBack();
    $("claim-go").addEventListener("click", function () {
      var value = ($("claim-name").value || "").trim().replace(/^@/, "").toLowerCase();
      if (!value) { toast("Введите имя"); return; }
      openName(value);
    });
  }

  function bindDetailBack() {
    var back = $("detail-back");
    if (back) { back.addEventListener("click", closeDetail); }
  }

  /* ------------------------------------------------------------- подарки */

  function selectedFilterQuery() {
    var parts = [];
    ["collection", "model", "backdrop", "symbol"].forEach(function (key) {
      var values = state.filters[key] || [];
      if (values.length) {
        parts.push(encodeURIComponent(key) + "=" + encodeURIComponent(values.join(",")));
      }
    });
    return parts.length ? "&" + parts.join("&") : "";
  }

  function loadGifts(force) {
    if (!force && state.gifts && state.ownListings && state.giftCatalog) { renderGifts(); return; }
    if (!state.gifts) { $("gift-grid").innerHTML = '<div class="skeleton">Загружаем подарки…</div>'; }
    var filters = selectedFilterQuery();
    Promise.all([
      api("/api/gift-market?limit=100" + filters),
      api("/api/gift-market?mine=true&limit=100" + filters),
      api("/api/gift-market/catalog")
    ]).then(function (result) {
      state.gifts = (result[0] && result[0].listings) || [];
      state.ownListings = (result[1] && result[1].listings) || [];
      state.giftCatalog = result[2] || { collections: [], filters: {} };
      renderGifts();
    }).catch(function (error) {
      $("gift-grid").innerHTML = '<div class="empty">' + esc(error.message) + "</div>";
    });
  }

  function sortGifts(items) {
    var sorted = items.slice();
    sorted.sort(function (a, b) {
      var currencyDifference = currencyOf(a).localeCompare(currencyOf(b));
      if (currencyDifference) { return currencyDifference; }
      var difference = priceOf(a) - priceOf(b);
      return state.giftSort === "asc" ? difference : -difference;
    });
    return sorted;
  }

  function traitValue(item, key) {
    var traits = item && item.attributes && item.attributes.collectible_traits;
    if (!traits) { return ""; }
    var entry = traits[key];
    if (!entry && key === "symbol") { entry = traits.pattern; }
    if (typeof entry === "string") { return entry; }
    return entry && String(entry.name || "").trim() || "";
  }

  function filteredGifts(source) {
    var query = (state.giftQuery || "").trim().toLowerCase();
    return (source || []).filter(function (item) {
      var collectionFilters = state.filters.collection || [];
      if (collectionFilters.length && collectionFilters.indexOf(String(item.gift_name || "")) < 0) { return false; }
      var matched = ["model", "backdrop", "symbol"].every(function (key) {
        var values = state.filters[key] || [];
        return !values.length || values.indexOf(traitValue(item, key)) >= 0;
      });
      if (!matched) { return false; }
      if (query && String(item.gift_name || "").toLowerCase().indexOf(query) < 0) { return false; }
      return true;
    });
  }

  function renderSelectedFilters() {
    var node = $("selected-filters");
    var selections = [];
    ["collection", "model", "backdrop", "symbol"].forEach(function (key) {
      (state.filters[key] || []).forEach(function (value) {
        var label = key === "collection" ? value
          : ({ model: "Модель", backdrop: "Фон", symbol: "Символ" }[key] + ": " + value);
        selections.push({ key: key, value: value, label: label });
      });
    });
    node.hidden = selections.length === 0;
    node.innerHTML = selections.map(function (selection, index) {
      return '<button class="selected-filter" data-filter-index="' + index + '">'
        + '<span>' + esc(selection.label) + '</span><span class="remove">×</span></button>';
    }).join("");
    Array.prototype.forEach.call(node.querySelectorAll(".selected-filter"), function (button) {
      button.addEventListener("click", function () {
        var selection = selections[Number(button.dataset.filterIndex)];
        toggleFilterValue(selection.key, selection.value);
      });
    });
  }

  function renderGifts() {
    var activeCount = 0;
    ["collection", "model", "backdrop", "symbol"].forEach(function (key) {
      activeCount += (state.filters[key] || []).length;
    });
    $("gift-filter").textContent = activeCount ? "Фильтры · " + activeCount : "Фильтры";
    $("gift-filter").classList.toggle("on", activeCount > 0);
    $("gift-sort").textContent = state.giftSort === "asc" ? "Цена ↑" : "Цена ↓";
    var collectionCount = (state.filters.collection || []).length;
    $("collections").textContent = collectionCount
      ? "Коллекции · " + collectionCount : "Коллекции";
    $("collections").classList.toggle("on", collectionCount > 0);
    renderSelectedFilters();

    stopGiftModelPlayers();
    drawGrid($("my-gift-grid"), sortGifts(filteredGifts(state.ownListings)), true,
      "У вас пока нет своих подарков на продаже.");
    drawGrid($("gift-grid"), sortGifts(filteredGifts(state.gifts)), false,
      "Подарков по выбранным фильтрам не найдено.");
  }

  function drawGrid(container, items, owned, emptyMessage) {
    if (!items.length) {
      container.innerHTML = '<div class="empty">' + esc(emptyMessage || "Пока пусто.") + "</div>";
      return;
    }
    var inventory = container.id === "inventory-grid";
    container.innerHTML = items.map(function (item, index) {
      var emoji = String(item.gift_emoji || "🎁");
      var price = priceOf(item) > 0 ? priceLabel(item) : "";
      var uniqueNumber = Number(item.unique_num || 0);
      var stateText = owned
        ? (item.is_listed ? "На продаже" : "В инвентаре")
        : "Продаётся";
      var stateClass = owned ? (item.is_listed ? "blue" : "muted") : "green";
      var tile = '<button class="tile" data-index="' + index + '">'
        + '<span class="art" style="background:' + colorFor(item) + '">'
        + (uniqueNumber > 0 ? '<span class="tile-number">#' + num(uniqueNumber) + '</span>' : "")
        + '<span class="emoji">' + esc(emoji) + "</span>"
        + '<img alt="" hidden><span class="model-art" aria-hidden="true"></span>'
        + '<span class="pattern-art" aria-hidden="true"></span></span>'
        + '<span class="price"><span class="grow">' + esc(price) + "</span>"
        + '<span class="state ' + stateClass + '">' + esc(stateText) + "</span></span>"
        + "</button>";
      return inventory
        ? '<div class="inventory-item">' + tile
          + '<button class="inventory-withdraw" data-index="' + index + '">Вывести</button></div>'
        : tile;
    }).join("");

    Array.prototype.forEach.call(container.querySelectorAll(".tile"), function (tile) {
      var item = items[Number(tile.dataset.index)];
      var img = tile.querySelector("img");
      var emoji = tile.querySelector(".emoji");
      artwork(item.telegram_gift_id, img, emoji);
      requestModelArtwork(item, tile.querySelector(".model-art"), img, emoji, false);
      requestPatternArtwork(item, tile.querySelector(".pattern-art"), false);
      tile.addEventListener("click", function () { openGift(item, owned); });
    });
    if (inventory) {
      Array.prototype.forEach.call(container.querySelectorAll(".inventory-withdraw"), function (button) {
        var item = items[Number(button.dataset.index)];
        button.addEventListener("click", function () { withdrawGift(item, button); });
      });
    }
  }

  function openGift(item, owned) {
    var fragmentInventory = !!(item && item.fragment_inventory);
    var title = String(item.gift_name || "Подарок");
    var badge = fragmentInventory
      ? (item.is_listed ? '<span class="badge blue">На продаже</span>'
        : '<span class="badge muted">В инвентаре Fragment</span>')
      : (owned
        ? (item.is_listed ? '<span class="badge blue">На продаже</span>'
          : '<span class="badge muted">В инвентаре</span>')
        : '<span class="badge green">Продаётся</span>');

    var html = detailHead(title, badge);
    html += '<div class="big-art" style="background:' + colorFor(item) + '">'
      + (Number(item.unique_num || 0) > 0 ? '<span class="tile-number">#' + num(item.unique_num) + '</span>' : "")
      + '<span class="emoji">' + esc(item.gift_emoji || "🎁") + "</span>"
      + '<img alt="" hidden><div class="model-art" aria-hidden="true"></div>'
      + '<div class="pattern-art" aria-hidden="true"></div></div>';

    var traits = (item.attributes && item.attributes.collectible_traits) || null;
    var rows = "";
    if (fragmentInventory) {
      rows += kv("Владелец", "@fragment", null);
    } else if (owned) {
      rows += kv("Владелец", "Вы", null);
    } else if (item.seller_username) {
      rows += kv("Владелец", "@" + item.seller_username, null);
    }
    if (traits) {
      rows += kv("Модель", trait(traits, "model"));
      rows += kv("Символ", trait(traits, "symbol") || trait(traits, "pattern"));
      rows += kv("Фон", trait(traits, "backdrop"));
    }
    if (rows) { html += '<div class="card">' + rows + "</div>"; }

    if (fragmentInventory) {
      if (item.is_listed) {
        html += '<div class="card"><div class="label">Цена лота</div><div class="value big">'
          + esc(priceLabel(item)) + "</div></div>"
          + '<button class="primary" id="unlist-gift">Снять с продажи</button>';
      } else {
        html += '<div class="card"><div class="label">Цена продажи</div>'
          + '<select class="field" id="sell-currency"><option value="grams">💎 Gram</option><option value="stars">⭐ Stars</option></select>'
          + '<input class="field" id="sell-price" inputmode="numeric" placeholder="Сумма"></div>'
          + '<button class="primary" id="sell-gift">Продать</button>';
      }
      html += '<button class="primary" id="withdraw-gift">Вывести</button>';
    } else if (!owned) {
      html += '<div class="card"><div class="label">Цена продажи</div>'
        + '<div class="value big">' + esc(priceLabel(item)) + "</div></div>"
        + '<button class="primary" id="buy-gift">Купить за ' + esc(priceLabel(item)) + "</button>";
    } else if (item.is_listed) {
      html += '<div class="card"><div class="label">Цена лота</div><div class="value big">'
        + esc(priceLabel(item)) + "</div></div>"
        + '<button class="primary" id="unlist-gift">Снять с продажи</button>';
    } else {
      html += '<div class="card"><div class="label">Цена продажи</div>'
        + '<select class="field" id="sell-currency"><option value="grams">💎 Gram</option><option value="stars">⭐ Stars</option></select>'
        + '<input class="field" id="sell-price" inputmode="numeric" placeholder="Сумма"></div>'
        + '<button class="primary" id="sell-gift">Продать</button>';
    }

    openDetail(html);
    bindDetailBack();
    var detailArt = $("view-detail").querySelector(".big-art");
    var detailImg = detailArt.querySelector("img");
    var detailEmoji = detailArt.querySelector(".emoji");
    artwork(item.telegram_gift_id, detailImg, detailEmoji);
    requestModelArtwork(item, detailArt.querySelector(".model-art"), detailImg, detailEmoji, true);
    requestPatternArtwork(item, detailArt.querySelector(".pattern-art"), true);

    if ($("buy-gift")) {
      $("buy-gift").addEventListener("click", function () {
        api("/api/gift-market/" + Number(item.listing_id) + "/purchase", { method: "POST", body: {} })
          .then(function () {
            state.gifts = null;
            state.ownListings = null;
            state.inventory = null;
            state.tab = "inventory";
            toast("Подарок куплен и добавлен в инвентарь Fragment");
            closeDetail();
          })
          .catch(function (error) { toast(error.message); });
      });
    }
    if ($("withdraw-gift")) {
      $("withdraw-gift").addEventListener("click", function (event) {
        withdrawGift(item, event.currentTarget);
      });
    }
    if ($("unlist-gift")) {
      $("unlist-gift").addEventListener("click", function () {
        api("/api/gifts/" + encodeURIComponent(item.serial_number) + "/list", { method: "DELETE" })
          .then(function () {
            state.inventory = null;
            state.gifts = null;
            state.ownListings = null;
            toast("Подарок снят с продажи");
            closeDetail();
          })
          .catch(function (error) { toast(error.message); });
      });
    }
    if ($("sell-gift")) {
      $("sell-gift").addEventListener("click", function () {
        var price = Number(($("sell-price").value || "").trim());
        var currency = $("sell-currency").value;
        if (!(price > 0)) { toast("Укажите цену"); return; }
        api("/api/gifts/" + encodeURIComponent(item.serial_number) + "/list",
          { method: "POST", body: { currency: currency, price: price } })
          .then(function () {
            state.inventory = null;
            state.gifts = null;
            state.ownListings = null;
            toast("Подарок выставлен на рынок");
            closeDetail();
          })
          .catch(function (error) { toast(error.message); });
      });
    }
  }

  function withdrawGift(item, button) {
    var serial = String(item && item.serial_number || "").trim();
    if (!serial || state.busy) { return; }
    state.busy = true;
    if (button) { button.disabled = true; }
    api("/api/me/fragment/gifts/" + encodeURIComponent(serial) + "/withdraw", {
      method: "POST",
      body: {},
      idempotency: idem("withdraw", serial)
    }).then(function () {
      state.inventory = null;
      state.gifts = null;
      state.ownListings = null;
      toast("Подарок выведен из Fragment — он пришёл в чат от @fragment");
      if (!$('view-detail').hidden) {
        state.tab = "inventory";
        closeDetail();
      } else {
        loadInventory();
      }
    }).catch(function (error) {
      toast(error.message);
    }).then(function () {
      state.busy = false;
      if (button) { button.disabled = false; }
    });
  }

  function kv(label, value, percent) {
    if (value == null || value === "") { return ""; }
    return '<div class="kv"><span class="k">' + esc(label) + '</span><span class="v">'
      + esc(value) + "</span>" + (percent ? '<span class="badge blue">' + esc(percent) + "</span>" : "")
      + "</div>";
  }

  function trait(traits, key) {
    var entry = traits[key];
    if (!entry) { return ""; }
    return typeof entry === "string" ? entry : (entry.name || "");
  }

  /* ----------------------------------------------------------- инвентарь */

  function loadInventory() {
    if (state.inventory) { renderInventory(); return; }
    $("inventory-grid").innerHTML = '<div class="skeleton">Загружаем инвентарь…</div>';
    api("/api/me/fragment/gifts").then(function (data) {
      state.inventory = (data && data.gifts) || [];
      renderInventory();
    }).catch(function (error) {
      $("inventory-grid").innerHTML = '<div class="empty">' + esc(error.message) + "</div>";
    });
  }

  function renderInventory() {
    stopGiftModelPlayers();
    drawGrid(
      $("inventory-grid"),
      state.inventory || [],
      true,
      "Здесь появятся купленные и переданные подарки."
    );
  }

  /* -------------------------------------------------------------- запуск */

  function closeChoiceMenu() {
    if (!openMenu) { return; }
    document.removeEventListener("click", openMenu.outside, true);
    document.removeEventListener("keydown", openMenu.escape, true);
    if (openMenu.node.parentNode) { openMenu.node.parentNode.removeChild(openMenu.node); }
    openMenu = null;
  }

  function showChoiceMenu(anchor, options, selected, onSelect) {
    closeChoiceMenu();
    var menu = document.createElement("div");
    menu.className = "choice-menu";
    menu.setAttribute("role", "menu");
    options.forEach(function (option) {
      var button = document.createElement("button");
      button.type = "button";
      button.textContent = option.label;
      button.setAttribute("role", "menuitem");
      if (String(option.value) === String(selected)) { button.classList.add("selected"); }
      button.addEventListener("click", function () {
        closeChoiceMenu();
        onSelect(option.value);
      });
      menu.appendChild(button);
    });
    document.body.appendChild(menu);
    var rect = anchor.getBoundingClientRect();
    var menuRect = menu.getBoundingClientRect();
    var left = Math.max(8, Math.min(rect.left, window.innerWidth - menuRect.width - 8));
    var top = rect.bottom + 4;
    if (top + menuRect.height > window.innerHeight - 8) {
      top = Math.max(8, rect.top - menuRect.height - 4);
    }
    menu.style.left = left + "px";
    menu.style.top = top + "px";
    var outside = function (event) {
      if (!menu.contains(event.target) && event.target !== anchor) { closeChoiceMenu(); }
    };
    var escape = function (event) {
      if (event.key === "Escape") { closeChoiceMenu(); }
    };
    openMenu = { node: menu, outside: outside, escape: escape };
    document.addEventListener("click", outside, true);
    document.addEventListener("keydown", escape, true);
  }

  function filterOptions(key) {
    var catalog = state.giftCatalog || {};
    if (key === "collection") { return catalog.collections || []; }
    var filters = catalog.filters || {};
    return filters[key] || [];
  }

  function openSelectionSheet(mode) {
    state.sheetMode = mode;
    state.sheetSearch = { collection: "", model: "", backdrop: "", symbol: "" };
    $("selection-sheet").hidden = false;
    $("sheet-title").textContent = mode === "collections" ? "Коллекции" : "Фильтры";
    renderSelectionSheet();
  }

  function closeSelectionSheet() {
    $("selection-sheet").hidden = true;
    state.sheetMode = "";
  }

  function renderSelectionSheet() {
    if (state.sheetMode === "collections") { renderCollectionsSheet(); }
    else if (state.sheetMode === "filters") { renderFiltersSheet(); }
  }

  function applyFilterChange() {
    state.gifts = null;
    state.ownListings = null;
    loadGifts(true);
  }

  function toggleFilterValue(key, value) {
    var selected = (state.filters[key] || []).slice();
    var index = selected.indexOf(value);
    if (index >= 0) { selected.splice(index, 1); }
    else { selected.push(value); }
    state.filters[key] = selected;
    renderSelectionSheet();
    applyFilterChange();
  }

  function setFilterCheckbox(key, value, checked) {
    var selected = (state.filters[key] || []).slice();
    var options = filterOptions(key).map(function (option) { return String(option.name || ""); });
    if (!selected.length) {
      if (!checked) { selected = options.filter(function (option) { return option !== value; }); }
    } else if (checked) {
      if (selected.indexOf(value) < 0) { selected.push(value); }
    } else {
      selected = selected.filter(function (option) { return option !== value; });
    }
    state.filters[key] = selected.length >= options.length ? [] : selected;
    renderSelectionSheet();
    applyFilterChange();
  }

  function clearFilterSection(key) {
    state.filters[key] = [];
    renderSelectionSheet();
    applyFilterChange();
  }

  function renderCollectionsSheet() {
    var scrollTop = $("sheet-content").scrollTop;
    var all = filterOptions("collection");
    var query = String(state.sheetSearch.collection || "").trim().toLowerCase();
    var options = all.filter(function (item) {
      return !query || String(item.name || "").toLowerCase().indexOf(query) >= 0;
    });
    var selected = state.filters.collection || [];
    var total = all.reduce(function (sum, item) { return sum + Number(item.count || 0); }, 0);
    var html = '<label class="sheet-search"><span aria-hidden="true">⌕</span>'
      + '<input id="sheet-collection-search" placeholder="Поиск коллекций" value="' + esc(state.sheetSearch.collection || "") + '"></label>'
      + '<div class="collection-list">'
      + '<button class="collection-row" data-clear-collection="1"><span class="collection-icon">✦</span>'
      + '<span class="collection-copy"><span class="collection-name">Все коллекции</span>'
      + '<span class="collection-count">' + num(total) + ' подарков</span></span>'
      + '<span class="collection-check">' + (selected.length ? "" : "✓") + '</span></button>';
    options.forEach(function (item, index) {
      var name = String(item.name || "");
      var checked = selected.indexOf(name) >= 0;
      html += '<button class="collection-row' + (checked ? ' selected' : '') + '" data-collection-index="' + index + '">'
        + '<span class="collection-icon" style="background:' + esc(colorFor(item)) + '">'
        + '<span class="emoji">' + esc(item.gift_emoji || "🎁") + '</span>'
        + (item.telegram_gift_id ? '<img data-artwork-id="' + esc(item.telegram_gift_id) + '" alt="" hidden>' : '')
        + '</span><span class="collection-copy"><span class="collection-name">' + esc(name) + '</span>'
        + '<span class="collection-count">' + num(item.count || 0) + ' подарков</span></span>'
        + '<span class="collection-check">' + (checked ? "✓" : "") + '</span></button>';
    });
    html += '</div>';
    if (!options.length) { html += '<div class="empty">Коллекции не найдены.</div>'; }
    $("sheet-content").innerHTML = html;
    $("sheet-content").scrollTop = scrollTop;
    $("sheet-clear").hidden = !selected.length;
    var search = $("sheet-collection-search");
    search.addEventListener("input", function () {
      state.sheetSearch.collection = search.value;
      renderCollectionsSheet();
      var nextSearch = $("sheet-collection-search");
      nextSearch.focus();
      nextSearch.setSelectionRange(nextSearch.value.length, nextSearch.value.length);
    });
    var clear = $("sheet-content").querySelector("[data-clear-collection]");
    clear.addEventListener("click", function () { clearFilterSection("collection"); });
    Array.prototype.forEach.call($("sheet-content").querySelectorAll("[data-collection-index]"), function (button) {
      var item = options[Number(button.dataset.collectionIndex)];
      var img = button.querySelector("img");
      if (img) { artwork(img.dataset.artworkId, img, button.querySelector(".emoji")); }
      button.addEventListener("click", function () { toggleFilterValue("collection", String(item.name || "")); });
    });
  }

  function renderFiltersSheet() {
    var scrollTop = $("sheet-content").scrollTop;
    var definitions = [
      { key: "collection", title: "Collection" },
      { key: "model", title: "Model" },
      { key: "backdrop", title: "Backdrop" },
      { key: "symbol", title: "Symbol" }
    ];
    var html = '<div class="filter-intro">Выберите параметры подарков. Количество рядом со значением показывает активные лоты.</div>';
    definitions.forEach(function (section) {
      var options = filterOptions(section.key);
      var selected = state.filters[section.key] || [];
      var isAll = selected.length === 0;
      var open = !!state.openFilterSections[section.key];
      var title = section.title;
      html += '<section class="filter-section' + (open ? ' open' : '') + '" data-filter-section="' + section.key + '">'
        + '<button class="filter-section-head" data-section-toggle="' + section.key + '"><strong>' + title + '</strong>'
        + '<span class="selected-count">' + (isAll ? "Все" : selected.length + " выбрано") + '</span>'
        + '<span class="arrow">⌄</span></button>';
      if (open) {
        var search = String(state.sheetSearch[section.key] || "");
        var query = search.trim().toLowerCase();
        var visible = options.filter(function (option) {
          return !query || String(option.name || "").toLowerCase().indexOf(query) >= 0;
        });
        html += '<div class="filter-section-body"><label class="sheet-search"><span aria-hidden="true">⌕</span>'
          + '<input data-filter-search="' + section.key + '" placeholder="Поиск" value="' + esc(search) + '"></label>'
          + '<div class="filter-actions"><span>' + num(options.length) + ' значений</span>'
          + '<button data-select-all="' + section.key + '">Выбрать все</button></div>'
          + '<div class="filter-option-list">';
        visible.forEach(function (option) {
          var name = String(option.name || "");
          var checked = isAll || selected.indexOf(name) >= 0;
          html += '<label class="filter-option" data-option-search="' + esc(name.toLowerCase()) + '">'
            + '<input type="checkbox" data-filter-key="' + section.key + '" data-filter-value="' + esc(name) + '"'
            + (checked ? ' checked' : '') + '><span class="option-name">' + esc(name) + '</span>'
            + '<span class="option-count">' + num(option.count || 0) + '</span></label>';
        });
        if (!visible.length) { html += '<div class="empty">Значения не найдены.</div>'; }
        html += '</div></div>';
      }
      html += '</section>';
    });
    $("sheet-content").innerHTML = html;
    $("sheet-content").scrollTop = scrollTop;
    var anySelected = ["collection", "model", "backdrop", "symbol"].some(function (key) {
      return (state.filters[key] || []).length > 0;
    });
    $("sheet-clear").hidden = !anySelected;
    Array.prototype.forEach.call($("sheet-content").querySelectorAll("[data-section-toggle]"), function (button) {
      button.addEventListener("click", function () {
        var key = button.dataset.sectionToggle;
        state.openFilterSections[key] = !state.openFilterSections[key];
        renderFiltersSheet();
      });
    });
    Array.prototype.forEach.call($("sheet-content").querySelectorAll("[data-filter-search]"), function (input) {
      input.addEventListener("input", function () {
        state.sheetSearch[input.dataset.filterSearch] = input.value;
        var query = input.value.trim().toLowerCase();
        var section = input.closest(".filter-section");
        Array.prototype.forEach.call(section.querySelectorAll(".filter-option"), function (option) {
          option.hidden = query && option.dataset.optionSearch.indexOf(query) < 0;
        });
      });
    });
    Array.prototype.forEach.call($("sheet-content").querySelectorAll("[data-select-all]"), function (button) {
      button.addEventListener("click", function () { clearFilterSection(button.dataset.selectAll); });
    });
    Array.prototype.forEach.call($("sheet-content").querySelectorAll("[data-filter-key]"), function (input) {
      input.addEventListener("change", function () {
        setFilterCheckbox(input.dataset.filterKey, input.dataset.filterValue, input.checked);
      });
    });
  }

  function setAutoRefresh(tab, value) {
    var interval = Number(value) || 0;
    if (interval > 0 && interval < 10000) { interval = 10000; }
    if (autoRefreshTimers[tab]) { clearInterval(autoRefreshTimers[tab]); }
    autoRefreshTimers[tab] = null;
    state.autoRefresh[tab] = interval;
    var button = $(tab === "usernames" ? "user-autorefresh" : "gift-autorefresh");
    button.textContent = interval
      ? "Авто-обновление: " + Math.round(interval / 1000) + " с"
      : "Авто-обновление: выкл";
    if (interval >= 10000) {
      autoRefreshTimers[tab] = setInterval(function () {
        if (state.tab !== tab || !$('view-detail').hidden) { return; }
        if (tab === "usernames") { loadUsernames(true); }
        else { loadGifts(true); }
      }, interval);
    }
  }

  function chooseAutoRefresh(tab) {
    var button = $(tab === "usernames" ? "user-autorefresh" : "gift-autorefresh");
    var options = [
      { value: 0, label: "Выключено" },
      { value: 10000, label: "Каждые 10 секунд" },
      { value: 15000, label: "Каждые 15 секунд" },
      { value: 30000, label: "Каждые 30 секунд" },
      { value: 60000, label: "Каждую минуту" }
    ];
    showChoiceMenu(button, options, state.autoRefresh[tab], function (value) {
      setAutoRefresh(tab, value);
    });
  }

  function bindStatic() {
    Array.prototype.forEach.call($("tabs").children, function (button) {
      button.addEventListener("click", function () { showTab(button.dataset.tab); });
    });

    $("names-sort").addEventListener("click", function () {
      state.namesSort = state.namesSort === "asc" ? "desc" : "asc";
      renderUsernames();
    });
    $("name-search").addEventListener("input", function () {
      if (state.market) { renderUsernames(); }
    });
    $("user-autorefresh").addEventListener("click", function () { chooseAutoRefresh("usernames"); });

    $("gift-search").addEventListener("input", function () {
      state.giftQuery = $("gift-search").value;
      if (state.gifts || state.ownListings) { renderGifts(); }
    });
    $("gift-filter").addEventListener("click", function () { openSelectionSheet("filters"); });
    $("gift-sort").addEventListener("click", function () {
      showChoiceMenu($("gift-sort"), [
        { value: "asc", label: "Цена по возрастанию" },
        { value: "desc", label: "Цена по убыванию" }
      ], state.giftSort, function (value) {
        state.giftSort = value;
        if (state.gifts || state.ownListings) { renderGifts(); }
      });
    });
    $("gift-autorefresh").addEventListener("click", function () { chooseAutoRefresh("gifts"); });
    $("collections").addEventListener("click", function () { openSelectionSheet("collections"); });
    $("sheet-close").addEventListener("click", closeSelectionSheet);
    $("sheet-backdrop").addEventListener("click", closeSelectionSheet);
    $("sheet-clear").addEventListener("click", function () {
      if (state.sheetMode === "collections") {
        clearFilterSection("collection");
      } else {
        ["collection", "model", "backdrop", "symbol"].forEach(function (key) {
          state.filters[key] = [];
        });
        renderSelectionSheet();
        applyFilterChange();
      }
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && !$("selection-sheet").hidden) { closeSelectionSheet(); }
    });
    $("copy-fragment").addEventListener("click", function () { copy("@fragment"); });
  }

  function start() {
    if (bridge && typeof bridge.theme === "function") {
      var theme = String(bridge.theme() || "");
      document.body.className = theme === "light" ? "light" : "";
    }
    token = bridge && typeof bridge.token === "function" ? String(bridge.token() || "") : "";
    bindStatic();
    if (!token) {
      $("names-table").innerHTML = '<div class="empty">Откройте этот раздел в приложении WaysGram.</div>';
      return;
    }
    showTab("usernames");
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>
</body>
</html>
