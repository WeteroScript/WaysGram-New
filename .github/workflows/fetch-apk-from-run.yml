name: Fetch APK from build run

# One-off helper: the APK built in run 45263591303 is uploaded as an Actions artifact,
# but its blob storage is not reachable from the coding worker. Split it into <100 MB
# chunks here so the ordinary git remote can carry it back to the branch.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Actions run that produced WaysGram-New-APK-*"
        required: true
        default: "45263591303"
      artifact_name:
        description: "Artifact name"
        required: true
        default: "WaysGram-New-APK-311"

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download built APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/waysgram-apk

      - name: Split and commit APK parts
        shell: bash
        run: |
          set -euo pipefail
          APK="/tmp/waysgram-apk/WaysGram.apk"
          test -s "$APK"
          test -s /tmp/waysgram-apk/WaysGram.apk.sha256
          mkdir -p apk-parts
          rm -f apk-parts/apk-part-* apk-parts/WaysGram.apk.sha256
          split -b 40m "$APK" apk-parts/apk-part-
          cp /tmp/waysgram-apk/WaysGram.apk.sha256 apk-parts/WaysGram.apk.sha256
          ls -lh apk-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk-parts
          git commit -m "Fetch APK from run ${{ inputs.run_id }}"
          git push origin "HEAD:$GITHUB_REF_NAME"
