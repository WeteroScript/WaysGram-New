name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "gradlew"
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - "TMessagesProj/**"
      - "TMessagesProj_App/**"
      - "TMessagesProj_AppHuawei/**"
      - "TMessagesProj_AppStandalone/**"
      - "TMessagesProj_AppHockeyApp/**"
      - "TMessagesProj_AppTests/**"
      - "TMessagesProj_Modules/**"
      - "buildSrc/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Afat release APK
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check source snapshot is present
        run: |
          if [ ! -f gradlew ] || [ ! -f settings.gradle ]; then
            echo "::error::The Telegram-master source tree has not been imported into the repository root yet."
            exit 1
          fi

      - name: Fetch dependencies listed in the archive .gitmodules
        shell: bash
        run: |
          while read -r key path; do
            name="${key#submodule.}"
            name="${name%.path}"
            url="$(git config -f .gitmodules --get "submodule.${name}.url")"
            mkdir -p "$(dirname "$path")"
            if [ ! -d "$path/.git" ]; then
              git clone --depth 1 --recurse-submodules --shallow-submodules "$url" "$path"
            fi
          done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$')

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            :TMessagesProj_App:assembleAfatRelease

      - name: Verify APK
        run: test -s TMessagesProj_App/build/outputs/apk/afat/release/app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaysGram-New-APK-${{ github.run_number }}
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          if-no-files-found: error
          retention-days: 14
