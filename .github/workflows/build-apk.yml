name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Telegram-master.part*"
      - ".gitmodules"
      - "gradlew"
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - "TMessagesProj/**"
      - "TMessagesProj_App/**"
      - "TMessagesProj_AppHuawei/**"
      - "TMessagesProj_AppStandalone/**"
      - "TMessagesProj_AppHockeyApp/**"
      - "TMessagesProj_AppTests/**"
      - "TMessagesProj_Modules/**"
      - "buildSrc/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Afat release APK
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct and extract uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          cat Telegram-master.part01 Telegram-master.part02 Telegram-master.part03 Telegram-master.part04 Telegram-master.part05 > /tmp/Telegram-master.zip
          unzip -tq /tmp/Telegram-master.zip
          mkdir -p /tmp/waysgram-source
          unzip -q /tmp/Telegram-master.zip -d /tmp/waysgram-source
          source_dir="/tmp/waysgram-source/Telegram-master"
          if [ ! -d "$source_dir" ]; then
            echo "::error::Expected Telegram-master directory was not found in reconstructed archive."
            find /tmp/waysgram-source -maxdepth 2 -type f | head -50
            exit 1
          fi
          rsync -a --exclude='.git' --exclude='.github' "$source_dir/" ./

      - name: Check source snapshot is present
        run: |
          test -f gradlew
          test -f settings.gradle
          test -f TMessagesProj_App/build.gradle

      - name: Fetch dependencies listed in the archive .gitmodules
        shell: bash
        run: |
          set -euo pipefail
          while read -r key path; do
            name="${key#submodule.}"
            name="${name%.path}"
            url="$(git config -f .gitmodules --get "submodule.${name}.url")"
            mkdir -p "$(dirname "$path")"
            if [ ! -d "$path/.git" ]; then
              if [ "$path" = "TMessagesProj_Modules/media" ]; then
                # The release branch no longer carries the Groovy script expected by
                # this Telegram tree; use its Telegram-compatible Media3 fork branch.
                git clone --depth 1 --branch telegram-v1.10.1-ffmpeg --recurse-submodules --shallow-submodules "$url" "$path"
              else
                git clone --depth 1 --recurse-submodules --shallow-submodules "$url" "$path"
              fi
            fi
          done < <(git config -f .gitmodules --get-regexp '^submodule[.].*[.]path')
          test -s TMessagesProj_Modules/media/core_settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            :TMessagesProj_App:assembleAfatRelease

      - name: Verify APK
        run: test -s TMessagesProj_App/build/outputs/apk/afat/release/app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaysGram-New-APK-${{ github.run_number }}
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          if-no-files-found: error
          retention-days: 14
)
          test -s TMessagesProj_Modules/media/core_settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            :TMessagesProj_App:assembleAfatRelease

      - name: Verify APK
        run: test -s TMessagesProj_App/build/outputs/apk/afat/release/app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaysGram-New-APK-${{ github.run_number }}
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          if-no-files-found: error
          retention-days: 14
