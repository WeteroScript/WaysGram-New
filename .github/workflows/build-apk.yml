name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "WaysGram-Android.zip.part*"
      - ".gitmodules"
      - "gradlew"
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - "TMessagesProj/**"
      - "TMessagesProj_App/**"
      - "TMessagesProj_AppHuawei/**"
      - "TMessagesProj_AppStandalone/**"
      - "TMessagesProj_AppHockeyApp/**"
      - "TMessagesProj_AppTests/**"
      - "TMessagesProj_Modules/**"
      - "buildSrc/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Afat release APK
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct and extract uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          cat WaysGram-Android.zip.part1 WaysGram-Android.zip.part2 WaysGram-Android.zip.part3 WaysGram-Android.zip.part4 WaysGram-Android.zip.part5 > /tmp/WaysGram-Android.zip
          unzip -tq /tmp/WaysGram-Android.zip
          mkdir -p /tmp/waysgram-source
          unzip -q /tmp/WaysGram-Android.zip -d /tmp/waysgram-source
          source_dir="/tmp/waysgram-source/WaysGram-Android"
          if [ ! -d "$source_dir" ]; then
            echo "::error::Expected WaysGram-Android directory was not found in reconstructed archive."
            find /tmp/waysgram-source -maxdepth 2 -type f | head -50
            exit 1
          fi
          rsync -a --exclude='.git' --exclude='.github' "$source_dir/" ./

      - name: Check source snapshot is present
        run: |
          test -f gradlew
          test -f settings.gradle
          test -f TMessagesProj_App/build.gradle

      - name: Apply Java type compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("TMessagesProj/src/main/java/org/telegram/tgnet/WaysGramMapper.java")
          source = path.read_text()
          old = "message.id = id;"
          new = "message.id = Math.toIntExact(id);"
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one WaysGramMapper assignment to patch")
          path.write_text(source.replace(old, new, 1))
          PY
          grep -Fq 'message.id = Math.toIntExact(id);' TMessagesProj/src/main/java/org/telegram/tgnet/WaysGramMapper.java

      - name: Fetch dependencies listed in the archive .gitmodules
        shell: bash
        run: |
          set -euo pipefail
          while read -r key path; do
            name="${key#submodule.}"
            name="${name%.path}"
            url="$(git config -f .gitmodules --get "submodule.${name}.url")"
            mkdir -p "$(dirname "$path")"
            if [ ! -d "$path/.git" ]; then
              if [ "$path" = "TMessagesProj_Modules/media" ]; then
                git clone --depth 1 --branch telegram-v1.10.1-ffmpeg --recurse-submodules --shallow-submodules "$url" "$path"
              elif [ "$path" = "TMessagesProj/jni/third_party/absl" ]; then
                git clone --depth 1 --branch 20250127.1 --recurse-submodules --shallow-submodules "$url" "$path"
              elif [ "$path" = "TMessagesProj/jni/tgcalls" ]; then
                git clone --depth 1 --branch dev/android --recurse-submodules --shallow-submodules "$url" "$path"
              else
                git clone --depth 1 --recurse-submodules --shallow-submodules "$url" "$path"
              fi
            fi
          done < <(git config -f .gitmodules --get-regexp '^submodule[.].*[.]path')
          test -s TMessagesProj_Modules/media/core_settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Rebuild native static libraries against source dependencies
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/TMessagesProj/jni"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          PREBUILT="$ROOT/prebuild/lib"
          BORING="$ROOT/third_party/boringssl"
          BOOST_REGEX="$ROOT/third_party/boost-regex"
          PRISMA="$ROOT/third_party/libprisma"

          test -d "$BORING"
          test -d "$BOOST_REGEX"
          test -f "$PRISMA/CMakeLists.txt"
          test -d "$PREBUILT"

          mkdir -p /tmp/waysgram-prisma-wrapper
          cat > /tmp/waysgram-prisma-wrapper/CMakeLists.txt <<EOF
          cmake_minimum_required(VERSION 3.22)
          project(WaysGramPrisma LANGUAGES CXX)
          set(BOOST_REGEX_STANDALONE ON CACHE BOOL "" FORCE)
          add_subdirectory("$BOOST_REGEX" boost-regex)
          add_subdirectory("$PRISMA" prisma)
          EOF

          found_abi=0
          for ABI_DIR in "$PREBUILT"/*; do
            [ -d "$ABI_DIR" ] || continue
            ABI="$(basename "$ABI_DIR")"
            case "$ABI" in
              arm64-v8a|armeabi-v7a|x86|x86_64) ;;
              *) echo "Skipping unsupported prebuilt ABI directory: $ABI"; continue ;;
            esac
            found_abi=1
            echo "::group::Rebuilding BoringSSL and Prisma for $ABI"

            BSSL_BUILD="/tmp/waysgram-boringssl-$ABI"
            cmake -S "$BORING" -B "$BSSL_BUILD" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-23 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=OFF \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON
            cmake --build "$BSSL_BUILD" --target crypto ssl --parallel 2

            CRYPTO_LIB="$(find "$BSSL_BUILD" -type f -name libcrypto.a -print -quit)"
            SSL_LIB="$(find "$BSSL_BUILD" -type f -name libssl.a -print -quit)"
            test -s "$CRYPTO_LIB"
            test -s "$SSL_LIB"
            cp "$CRYPTO_LIB" "$ABI_DIR/libcrypto.a"
            cp "$SSL_LIB" "$ABI_DIR/libssl.a"

            cat > "/tmp/waysgram-boringssl-$ABI/legacy_sha.cc" <<'EOF'
          #include <cstddef>
          #include <openssl/evp.h>
          extern "C" __attribute__((visibility("default")))
          unsigned char *SHA256(const unsigned char *data, size_t len, unsigned char *out) {
            unsigned int written = 0;
            if (EVP_Digest(data, len, out, &written, EVP_sha256(), nullptr) != 1 || written != 32) return nullptr;
            return out;
          }
          extern "C" __attribute__((visibility("default")))
          unsigned char *SHA512(const unsigned char *data, size_t len, unsigned char *out) {
            unsigned int written = 0;
            if (EVP_Digest(data, len, out, &written, EVP_sha512(), nullptr) != 1 || written != 64) return nullptr;
            return out;
          }
          EOF
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
              --target="$([ "$ABI" = "arm64-v8a" ] && echo aarch64 || ([ "$ABI" = "armeabi-v7a" ] && echo armv7a || ([ "$ABI" = "x86" ] && echo i686 || echo x86_64)))-none-linux-android23" \
              --sysroot="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
              -fPIC -I"$BORING/include" -c "/tmp/waysgram-boringssl-$ABI/legacy_sha.cc" \
              -o "/tmp/waysgram-boringssl-$ABI/legacy_sha.o"
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" rcs "$ABI_DIR/libtdutils.a" "/tmp/waysgram-boringssl-$ABI/legacy_sha.o"
            LLVM_NM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
            "$LLVM_NM" --defined-only "$ABI_DIR/libtdutils.a" | grep -Eq " [Tt] SHA256$"
            "$LLVM_NM" --defined-only "$ABI_DIR/libtdutils.a" | grep -Eq " [Tt] SHA512$"

            PRISMA_BUILD="/tmp/waysgram-prisma-$ABI"
            cmake -S /tmp/waysgram-prisma-wrapper -B "$PRISMA_BUILD" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-23 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON
            cmake --build "$PRISMA_BUILD" --target prisma --parallel 2

            PRISMA_LIB="$(find "$PRISMA_BUILD" -type f -name libprisma.a -print -quit)"
            test -s "$PRISMA_LIB"
            cp "$PRISMA_LIB" "$ABI_DIR/libprisma.a"
            echo "Updated native libraries for $ABI"
            echo "::endgroup::"
          done
          test "$found_abi" -eq 1

      - name: Configure Firebase
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_CONFIG:-}" ]; then
            echo "::error::Add the FIREBASE_CONFIG repository secret containing the complete google-services.json file."
            exit 1
          fi
          printf '%s' "$FIREBASE_CONFIG" > TMessagesProj_App/google-services.json
          python3 -c 'import json; d=json.load(open("TMessagesProj_App/google-services.json")); clients=d.get("client", []); assert any(c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "org.waysgram.messenger" for c in clients), "Firebase package name mismatch"'

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            :TMessagesProj_App:assembleAfatRelease

      - name: Verify APK
        run: test -s TMessagesProj_App/build/outputs/apk/afat/release/app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaysGram-New-APK-${{ github.run_number }}
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          if-no-files-found: error
          retention-days: 14

# Trigger a fresh build after Firebase configuration was added.
