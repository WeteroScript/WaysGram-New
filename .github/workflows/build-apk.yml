name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Telegram source into this repository
        shell: bash
        run: |
          if [[ ! -f gradlew || ! -f settings.gradle ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add upstream https://github.com/DrKLO/Telegram.git
            git fetch --depth=1 upstream master
            git merge --allow-unrelated-histories --no-edit FETCH_HEAD
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Initialize Git submodules
        run: git submodule update --init --recursive --depth=1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" \
            --stacktrace :TMessagesProj_App:assembleAfatDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaysGram-Android-debug-APK
          path: TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          if-no-files-found: error
          retention-days: 14
