name: AuthBot

# The AuthBot lives in ./authbot inside the WaysGram-New monorepo, so every path filter here
# is prefixed with that folder. The Android build has its own workflow (build-apk.yml) and
# ignores authbot/**.

on:
  push:
    branches:
      - main
    paths:
      - "authbot/**"
      - "bot.py"
      - "requirements.txt"
      - "Procfile"
      - "runtime.txt"
      - ".github/workflows/authbot.yml"
  pull_request:
    paths:
      - "authbot/**"
      - "bot.py"
      - "requirements.txt"
      - "Procfile"
      - "runtime.txt"
      - ".github/workflows/authbot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: authbot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: authbot/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Check Termux launcher syntax
        run: bash -n scripts/run-termux.sh
      - name: Compile Python files
        run: python -m compileall -q bot.py messenger_api.py tests
      - name: Run tests
        run: python -m pytest -q

  bootstrap:
    name: Pulls AuthBot from its repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: authbot/requirements.txt
      - name: Install dependencies declared by the repository
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pull and unpack the bot without starting it
        env:
          AUTHBOT_HOME: ${{ runner.temp }}/authbot-cache
        run: python bot.py --check > bootstrap.json
      - name: Verify the pulled entry point
        run: |
          python - <<'PY'
          import json
          import os

          data = json.load(open("bootstrap.json", encoding="utf-8"))
          print(json.dumps(data, ensure_ascii=False, indent=2))
          assert os.path.isfile(data["entry"]), data["entry"]
          assert os.path.isdir(data["source"]), data["source"]
          source_dir = data['source']
          assert os.path.isfile(os.path.join(source_dir, "messenger_api.py"))
          print("remote pull ok")
          PY
      - name: Verify the committed fallback copy
        env:
          AUTHBOT_SOURCE: local
        run: python bot.py --check > fallback.json
      - name: Verify the fallback entry point
        run: |
          python - <<'PY'
          import json
          import os

          data = json.load(open("fallback.json", encoding="utf-8"))
          assert os.path.isfile(data["entry"]), data["entry"]
          print("local fallback ok")
          PY

  container:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        working-directory: authbot
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env
      - name: Build AuthBot image
        run: docker build --pull --tag waysgram-authbot:test authbot
      - name: Compile server modules inside the image
        run: |
          docker run --rm --entrypoint python waysgram-authbot:test \
            -m compileall -q bot.py messenger_api.py otp_webhook.py tests
      - name: Verify healthcheck configuration
        run: |
          docker image inspect waysgram-authbot:test \
            --format '{{json .Config.Healthcheck}}' |
            grep -q '127.0.0.1'
