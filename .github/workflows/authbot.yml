name: AuthBot

# The AuthBot lives in ./authbot inside the WaysGram-New monorepo, so every path filter here
# is prefixed with that folder. The Android build has its own workflow (build-apk.yml) and
# ignores authbot/**.

on:
  push:
    branches:
      - main
    paths:
      - "authbot/**"
      - "bot.py"
      - "requirements.txt"
      - "Procfile"
      - "runtime.txt"
      - ".github/workflows/authbot.yml"
  pull_request:
    paths:
      - "authbot/**"
      - "bot.py"
      - "requirements.txt"
      - "Procfile"
      - "runtime.txt"
      - ".github/workflows/authbot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: authbot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: authbot/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Check Termux launcher syntax
        run: bash -n scripts/run-termux.sh
      - name: Compile Python files
        run: python -m compileall -q bot.py messenger_api.py tests
      - name: Run tests
        run: python -m pytest -q

  entrypoint:
    name: Root entry point (authbot/ in this repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: authbot/requirements.txt
      - name: Verify the entry point without installing anything
        run: python bot.py --check > entry.json
      - name: Check the reported path
        run: |
          python - <<'PY'
          import json
          import os

          data = json.load(open("entry.json", encoding="utf-8"))
          print(json.dumps(data, ensure_ascii=False, indent=2))
          assert os.path.isfile(data["entry"]), data["entry"]
          assert os.path.isfile(os.path.join(data["source"], "messenger_api.py"))
          print("local entry point ok")
          PY

  launcher:
    name: Launcher pulls authbot/ from this repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull authbot/ through the GitHub API
        env:
          WAYSGRAM_REF: ${{ github.head_ref || github.ref_name }}
          WAYSGRAM_HOME: ${{ runner.temp }}/waysgram-cache
          # Unauthenticated GitHub API calls are rate limited per runner IP, which made the
          # "second start comes from the cache" check fail whenever the limit was hit.
          AUTHBOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python deploy/authbot-bridge/bot.py --check > launcher.json
      - name: Verify what the launcher unpacked
        run: |
          python - <<'PY'
          import json
          import os

          data = json.load(open("launcher.json", encoding="utf-8"))
          print(json.dumps(data, ensure_ascii=False, indent=2))
          assert data["subdir"] == "authbot"
          assert os.path.isfile(data["entry"]), data["entry"]
          assert os.path.basename(os.path.dirname(data["entry"])) == "authbot"
          assert os.path.isfile(os.path.join(os.path.dirname(data["entry"]), "messenger_api.py"))
          print("launcher pull ok")
          PY
      - name: Second start must come from the cache
        env:
          WAYSGRAM_REF: ${{ github.head_ref || github.ref_name }}
          WAYSGRAM_HOME: ${{ runner.temp }}/waysgram-cache
          AUTHBOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python deploy/authbot-bridge/bot.py --check 2>&1 | tee second.json
          grep -q "using cached commit" second.json

  container:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        working-directory: authbot
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env
      - name: Build AuthBot image
        run: docker build --pull --tag waysgram-authbot:test authbot
      - name: Compile server modules inside the image
        run: |
          docker run --rm --entrypoint python waysgram-authbot:test \
            -m compileall -q bot.py messenger_api.py otp_webhook.py tests
      - name: Verify healthcheck configuration
        run: |
          docker image inspect waysgram-authbot:test \
            --format '{{json .Config.Healthcheck}}' |
            grep -q '127.0.0.1'


  apply-stage1-android-patch:
    name: Apply and statically verify stage 1 Android patch
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply Android source patch and rebuild split archive
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          test -s android-stage1.patch
          cat WaysGram-Android.zip.part1 WaysGram-Android.zip.part2 WaysGram-Android.zip.part3 WaysGram-Android.zip.part4 WaysGram-Android.zip.part5 > /tmp/WaysGram-Android.original.zip
          unzip -tq /tmp/WaysGram-Android.original.zip
          mkdir -p /tmp/waysgram-android-source
          unzip -q /tmp/WaysGram-Android.original.zip -d /tmp/waysgram-android-source
          ANDROID_MEDIA=/tmp/waysgram-android-source/WaysGram-Android/TMessagesProj/src/main/java/org/telegram/tgnet/WaysGramMedia.java
          if grep -Fq 'videoCoverThumbnail' "$ANDROID_MEDIA"; then
            echo "Media spoiler and custom video-cover bridge is already present."
          else
            patch --batch --forward -p1 -d /tmp/waysgram-android-source < android-stage1.patch
          fi
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          messages = Path("/tmp/waysgram-android-source/WaysGram-Android/TMessagesProj/src/main/java/org/telegram/tgnet/WaysGramMessages.java")
          send_helper = Path("/tmp/waysgram-android-source/WaysGram-Android/TMessagesProj/src/main/java/org/telegram/messenger/SendMessagesHelper.java")
          message_text = messages.read_text(encoding="utf-8")
          message_text = message_text.replace("req.id.size() > 100", "req.id.size() > 20")
          messages.write_text(message_text, encoding="utf-8")
          helper_text = send_helper.read_text(encoding="utf-8")
          helper_text = helper_text.replace(
              "if (arr.size() == 100 || a == messages.size() - 1",
              "if (arr.size() == (org.telegram.tgnet.WaysGramTransport.ENABLED ? 20 : 100) || a == messages.size() - 1",
          )
          send_helper.write_text(helper_text, encoding="utf-8")
          assert "req.id.size() > 20" in message_text
          assert "arr.size() == (org.telegram.tgnet.WaysGramTransport.ENABLED ? 20 : 100)" in helper_text

          original = Path("/tmp/WaysGram-Android.original.zip")
          rebuilt = Path("/tmp/WaysGram-Android.updated.zip")
          replacements = {
              "WaysGram-Android/TMessagesProj/src/main/java/org/telegram/tgnet/WaysGramMessages.java":
                  messages,
              "WaysGram-Android/TMessagesProj/src/main/java/org/telegram/messenger/SendMessagesHelper.java":
                  send_helper,
          }
          with zipfile.ZipFile(original, "r") as source, zipfile.ZipFile(rebuilt, "w", allowZip64=True) as output:
              names = set(source.namelist())
              assert names.issuperset(replacements), "A patched Android source file is missing from the archive"
              for info in source.infolist():
                  data = replacements[info.filename].read_bytes() if info.filename in replacements else source.read(info.filename)
                  output.writestr(info, data)
          with zipfile.ZipFile(rebuilt, "r") as archive:
              bad = archive.testzip()
              assert bad is None, f"Corrupt ZIP member: {bad}"
              assert set(replacements).issubset(archive.namelist())
              assert b'remove_media' in archive.read("WaysGram-Android/TMessagesProj/src/main/java/org/telegram/tgnet/WaysGramMessages.java")
              assert b'req.id.size() > 20' in archive.read("WaysGram-Android/TMessagesProj/src/main/java/org/telegram/tgnet/WaysGramMessages.java")
              assert b'WaysGramTransport.ENABLED ? 20 : 100' in archive.read("WaysGram-Android/TMessagesProj/src/main/java/org/telegram/messenger/SendMessagesHelper.java")
          part_size = 23_068_672
          data = rebuilt.read_bytes()
          assert len(data) > part_size * 4
          for index in range(5):
              chunk = data[index * part_size:(index + 1) * part_size]
              path = Path(f"WaysGram-Android.zip.part{index + 1}")
              path.write_bytes(chunk)
          assert Path("WaysGram-Android.zip.part5").stat().st_size > 0
          PY
      - name: Run Android source contract checks (no Gradle build)
        run: python3 scripts/test_android_messaging.py
      - name: Commit updated source archive
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add WaysGram-Android.zip.part1 WaysGram-Android.zip.part2 WaysGram-Android.zip.part3 WaysGram-Android.zip.part4 WaysGram-Android.zip.part5
          if git diff --cached --quiet; then
            echo "Android source archive already contains the requested patch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: remove single message attachments"
          git push origin "HEAD:refs/heads/${HEAD_REF}"

  export-android-source:
    name: Temporary export of Android source archive
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reconstruct and validate source archive
        run: |
          set -euo pipefail
          cat WaysGram-Android.zip.part1 WaysGram-Android.zip.part2 WaysGram-Android.zip.part3 WaysGram-Android.zip.part4 WaysGram-Android.zip.part5 > /tmp/WaysGram-Android.zip
          unzip -tq /tmp/WaysGram-Android.zip
      - name: Upload source archive for the code audit
        uses: actions/upload-artifact@v4
        with:
          name: waysgram-android-source-audit
          path: /tmp/WaysGram-Android.zip
          compression-level: 0
          retention-days: 1
