APP_VERSION_CODE=7237
APP_VERSION_NAME=13.1.1
APP_PACKAGE=org.waysgram.messenger
IS_PRIVATE=false
RELEASE_KEY_PASSWORD=WaysGram-Release-2026-7ec5551a
RELEASE_KEY_ALIAS=waysgram
RELEASE_STORE_PASSWORD=WaysGram-Release-2026-7ec5551a
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
android.enableResourceOptimizations=true
org.gradle.tooling.parallel=true

# GitHub runner: the Kotlin compiler daemon sometimes fails to start (exit code 0/137),
# which breaks buildSrc and the whole configuration phase. Compile Kotlin in the Gradle JVM.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
